<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serveur maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : en-tête avec horloge, puis une grille de boutons rectangulaires. Chaque bouton ouvre le service et porte ses propres mesures (processeur, mémoire, disque) quand il tourne sur le serveur. */
:root{
  --bg:#08090C; --panel:#121419; --line:#23262E;
  --fg:#F2F1EE; --mut:#9A9DA6; --faint:#666A74;
  --accent:#F2B544; --ok:#3DD68C; --warn:#F2B544; --bad:#FF6B4A;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(242,181,68,0.08),transparent 60%),var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{margin:4px 0 0;font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.clock{font-family:var(--mono);font-size:clamp(28px,4vw,40px);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gear{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--mut);display:grid;place-items:center;cursor:pointer;z-index:5}
.gear:hover,.gear:focus-visible{color:var(--accent);border-color:rgba(242,181,68,0.45);outline:none}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ov-head h2{margin:0;font-size:24px;font-weight:600}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.net{display:flex;flex-direction:column;align-items:center}
.node{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.node .ico{width:40px;height:40px;border-radius:11px}
.node .ico .logo{width:24px;height:24px}
.node b{display:block;font-size:15px;font-weight:600}
.node code{display:block;font-family:var(--mono);font-size:12px;color:var(--faint)}
.node small{display:block;font-size:12px;color:var(--mut)}
.node .state{margin-left:auto;padding-left:10px}
.vline{width:2px;height:28px;background:linear-gradient(var(--line),#3A3F4A)}
.branches{width:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;position:relative;padding-top:28px}
.branches::before{content:"";position:absolute;top:0;left:30%;right:20%;height:2px;background:#3A3F4A}
.branches>div{position:relative}
.branches>div::before{content:"";position:absolute;top:-28px;left:50%;width:2px;height:28px;background:#3A3F4A}
.host{border:2px solid rgba(255,154,92,0.55);border-radius:20px;padding:16px;background:rgba(255,154,92,0.04);display:flex;flex-direction:column;gap:12px}
.host-h{display:flex;align-items:center;gap:12px}
.host-h b{display:block;font-size:17px;font-weight:600}
.host-h code{display:block;font-family:var(--mono);font-size:12px;color:var(--faint)}
.host-h small{display:block;font-size:12px;color:var(--mut)}
.host-h .ico{width:44px;height:44px;border-radius:12px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.guests{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.guest{border-left:3px solid var(--gc,#5CC8FF)}
.devs{display:flex;flex-direction:column;gap:10px}
.wifi{border:2px dashed rgba(127,176,255,0.4);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.vlan{width:100%;border:1.5px solid rgba(61,214,140,0.35);border-radius:24px;padding:14px 16px 18px;background:rgba(61,214,140,0.03);display:flex;flex-direction:column;align-items:center}
.vlan-h{align-self:stretch;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.vlan-h b{font-size:13px;font-weight:600;color:#7BE2AE}
.vlan-h span{font-size:12px;color:var(--mut)}
.scan{width:100%;margin-top:18px}
.scan table{width:100%;border-collapse:collapse;font-size:13px}
.scan th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line)}
.scan td{padding:8px 10px;border-bottom:1px solid var(--line);color:#D6D8DD}
.scan td code{font-family:var(--mono);font-size:12px;color:var(--fg)}
.scan td.k{color:var(--accent);font-weight:600}
.scan-wrap{overflow-x:auto}
.arch-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.05) 1px,transparent 0) 0 0/22px 22px,#0B0D11}
.arch{display:block;width:100%;min-width:900px;height:auto}
.arch text{font-family:var(--sans)}
.arch .mono{font-family:var(--mono)}
.legend i{display:inline-block;width:26px;height:0;border-top:2px solid;vertical-align:middle;margin-right:8px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
@media (max-width:760px){.branches{grid-template-columns:1fr;border-top:0;padding-top:0}.branches>div::before{display:none}.branches>div+div{margin-top:22px}}
.err{border:1px solid rgba(255,107,74,0.4);background:rgba(255,107,74,0.08);color:#FFB4A3;border-radius:14px;padding:12px 16px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.tile{display:grid;grid-template-columns:56px minmax(0,1fr) auto;column-gap:16px;row-gap:14px;align-items:center;padding:18px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s ease,border-color .2s ease}
.tile:hover{transform:translateY(-2px);border-color:rgba(242,181,68,0.45)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ico{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:var(--ic)}
.ico .logo{width:34px;height:34px;object-fit:contain}
.name{min-width:0}
.name b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name code{display:block;font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.state i{width:9px;height:9px;border-radius:50%;background:#555A64;flex:none}
.state.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.state.ko i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.state.ko{color:#FF9A85}
.metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;padding-top:14px;border-top:1px solid var(--line)}
.metrics:empty{display:none}
.mt{display:flex;flex-direction:column;gap:6px;min-width:0}
.mt span{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
.mt span em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,0.07);overflow:hidden}
.mt i b{display:block;height:100%;border-radius:3px;transition:width .6s ease}
footer{color:var(--faint);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Maison · réseau local</div>
      <h1>Serveur maison</h1>
      <div class="sub" id="sub">Connexion au serveur…</div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="err" id="err" hidden></div>
  <div class="tiles" id="tiles"></div>
  <footer>Mis à jour toutes les 2 secondes · <span id="maj">–</span></footer>
</div>
<button class="gear" id="gear" type="button" aria-label="Afficher le schéma du réseau"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="Schéma du réseau">
  <div class="ov-in">
    <div class="ov-head"><div><div class="eyebrow">Maison · réseau local</div><h2>Architecture</h2></div><button class="x" id="ovx" type="button" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="net" id="net"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const ICONS = {
  serveur: '<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01M12 7.5h4M12 16.5h4"/>',
  maison: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  visage: '<circle cx="12" cy="10" r="4"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/>',
  tableau: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 15l3-3 3 2 4-5"/>',
  tv: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  box: '<rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 12.5h.01M11 12.5h.01M8 8l-2-4M16 8l2-4"/>',
  tablette: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M11 18h2"/>',
  garage: '<path d="M3 10.5L12 4l9 6.5V20H3z"/><path d="M7 20v-7.5h10V20M7 15h10M7 17.5h10"/>',
  monde: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  lien: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const COLORS = { tv: ['rgba(200,200,210,0.12)', '#D6D8DD'], box: ['rgba(200,200,210,0.12)', '#D6D8DD'], serveur: ['rgba(255,138,76,0.14)', '#FF9A5C'], maison: ['rgba(65,189,245,0.14)', '#5CC8FF'], visage: ['rgba(177,151,255,0.14)', '#B9A8FF'], tableau: ['rgba(242,181,68,0.14)', '#F2B544'], tablette: ['rgba(242,181,68,0.14)', '#F2B544'], garage: ['rgba(61,214,140,0.14)', '#3DD68C'], monde: ['rgba(127,176,255,0.14)', '#9CC2FF'] };
// Logos officiels : projet libre « dashboard-icons » (chargés depuis internet ; pictogramme générique si indisponible).
const LOGOS = 'https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons';
window.svgFor = (name) => svg(name, 28);
const $ = (id) => document.getElementById(id);
const svg = (name, size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.lien}</svg>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Go = (b) => b == null ? '–' : (b / 1073741824).toLocaleString('fr-FR', { maximumFractionDigits: b < 10737418240 ? 1 : 0 }) + ' Go';
const Gn = (b) => b == null ? '–' : (b / 1073741824).toLocaleString('fr-FR', { maximumFractionDigits: b < 10737418240 ? 1 : 0 });
const pct = (a, b) => (a != null && b) ? a / b : 0;
const dur = (s) => { if (!s) return '–'; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} j ${h} h` : h ? `${h} h ${m} min` : `${m} min`; };
const col = (p) => p > 0.9 ? 'var(--bad)' : p > 0.75 ? 'var(--warn)' : 'var(--ok)';
const bar = (label, p, txt) => `<div class="mt"><span>${label}<em>${txt}</em></span><i><b style="width:${Math.max(0, Math.min(100, p * 100)).toFixed(1)}%;background:${col(p)}"></b></i></div>`;
const info = (label, txt) => `<div class="mt txt"><span>${label}<em>${txt}</em></span></div>`;

function metrics(s, d) {
  const n = d.noeud;
  if (s.noeud && n) {
    return bar('Processeur', n.cpu || 0, Math.round((n.cpu || 0) * 100) + ' %')
      + bar('Mémoire', pct(n.mem, n.memTotal), `${Gn(n.mem)} / ${Go(n.memTotal)}`)
      + bar('Disque', pct(n.disque, n.disqueTotal), `${Gn(n.disque)} / ${Go(n.disqueTotal)}`)
      + info('Allumé depuis', dur(n.uptime));
  }
  if (s.vmid != null) {
    const m = (d.machines || []).find((x) => x.vmid === s.vmid);
    if (!m) return '';
    if (m.status !== 'running') return info('État', 'arrêtée');
    return bar('Processeur', m.cpu || 0, Math.round((m.cpu || 0) * 100) + ' %')
      + bar('Mémoire', pct(m.mem, m.maxmem), `${Gn(m.mem)} / ${Go(m.maxmem)}`)
      + info('Allumée depuis', dur(m.uptime));
  }
  return '';
}

function subline(s, d) {
  if (s.noeud && d.noeud) return d.noeud.modele ? `${d.noeud.modele.replace(/\(R\)|\(TM\)|CPU|@.*$/g, '').replace(/\s+/g, ' ').trim()} · ${d.noeud.coeurs || '?'} cœurs` : 'Serveur';
  if (s.vmid != null) {
    const m = (d.machines || []).find((x) => x.vmid === s.vmid);
    return m ? `${m.type === 'lxc' ? 'Conteneur' : 'Machine virtuelle'} ${m.vmid} · « ${m.name} »` : `N° ${s.vmid} · pas encore installé`;
  }
  return s.externe ? 'Accès depuis internet' : 'Appareil du réseau';
}

function logoHtml(s, size) {
  const c = COLORS[s.icone] || COLORS.monde;
  const img = s.logo ? `<img class="logo" alt="" src="${LOGOS}/svg/${esc(s.logo)}.svg" data-png="${LOGOS}/png/${esc(s.logo)}.png" onerror="if(this.dataset.png){this.src=this.dataset.png;this.dataset.png='';}else{this.replaceWith(document.createRange().createContextualFragment(window.svgFor('${esc(s.icone)}')));}">` : svg(s.icone, size);
  return `<span class="ico" style="--c:${c[0]};--ic:${c[1]}">${img}</span>`;
}
const stateHtml = (s) => `<span class="state ${s.externe ? '' : s.ok === true ? 'ok' : s.ok === false ? 'ko' : ''}"><i></i><span>${s.externe ? 'cloud' : s.ok === true ? 'en ligne' : s.ok === false ? 'hors ligne' : ''}</span></span>`;
const host = (u) => { try { const x = new URL(u); return x.host; } catch (e) { return ''; } };
let lastData = null, reseau = null, reseauT = 0;
async function loadReseau() { try { reseau = await (await fetch('/api/reseau', { cache: 'no-store' })).json(); reseauT = Date.now(); drawNet(); } catch (e) { /* noop */ } }
function scanHtml(sv) {
  if (!reseau || !reseau.appareils || !reseau.appareils.length) return `<div class="scan"><div class="lbl">Appareils détectés sur le réseau</div><p class="sub">${reseau ? 'Balayage du réseau en cours (environ 1 minute)…' : 'Chargement…'}</p></div>`;
  const known = {};
  sv.forEach((s) => { const h = host(s.url || '').split(':')[0]; if (h) known[h] = s.nom; });
  known['192.168.86.1'] = 'Google Wifi (routeur)';
  const rows = reseau.appareils.map((a) => `<tr><td><code>${esc(a.ip)}</code></td><td class="${known[a.ip] ? 'k' : ''}">${esc(known[a.ip] || a.nom || '—')}</td><td>${esc(a.fabricant || 'inconnu')}</td><td><code>${esc(a.mac || '')}</code></td></tr>`).join('');
  const quand = reseau.t ? new Date(reseau.t * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
  return `<div class="scan"><div class="lbl" style="margin-bottom:8px">Appareils détectés sur le réseau · ${reseau.appareils.length} · balayage de ${quand}</div><div class="scan-wrap"><table><thead><tr><th>Adresse</th><th>Appareil</th><th>Fabricant</th><th>Adresse MAC</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function drawNet() {
  const d = lastData; if (!d) return;
  const sv = d.services || [], n = d.noeud || {};
  const S = (id) => sv.find((s) => s.id === id) || {};
  const M = (vmid) => (d.machines || []).find((m) => m.vmid === vmid);
  const ipOf = (s) => (host(s.url || '') || '').split(':')[0];
  const dot = (ok) => ok === true ? '#3DD68C' : ok === false ? '#FF6B4A' : '#5A606E';
  // Liaisons : couleur et tirets par type
  const L = { fibre: ['#F2B544', '', 'Fibre'], eth: ['#9AA0AC', '', 'Ethernet'], wifi: ['#7FB0FF', '6 5', 'Wi-Fi'], zigbee: ['#3DD68C', '2 4', 'Zigbee'], cloud: ['#B9A8FF', '8 6', 'Internet (cloud)'], virt: ['#FF9A5C', '', 'Pont virtuel vmbr0'] };
  const W = 1200, H = 860;
  const nodes = {}, out = [];
  const node = (id, x, y, w, h, title, sub, ic, o = {}) => { nodes[id] = { x, y, w, h }; out.push({ id, x, y, w, h, title, sub, ic, ...o }); };
  // Colonne centrale : internet → box → routeur
  node('inet', 520, 24, 160, 54, 'Internet', 'WAN', 'monde');
  node('box', 500, 122, 200, 58, 'Box opérateur', 'IP publique · NAT', 'box');
  node('gw', 470, 232, 260, 64, 'Google Wifi', '192.168.86.1 · routeur · DHCP', 'lien', { accent: '#9CC2FF' });
  // Hôte Proxmox (à gauche)
  const pveOn = S('proxmox').ok;
  node('pve', 70, 388, 516, 62, 'Proxmox VE · Dell OptiPlex 3000', `${ipOf(S('proxmox')) || '192.168.86.10'} · ${(n.modele || 'Celeron N5105').replace(/\(R\)|\(TM\)|CPU|Intel|@.*$/g, '').replace(/\s+/g, ' ').trim()} · CPU ${n.cpu != null ? Math.round(n.cpu * 100) + ' %' : '–'} · RAM ${n.memTotal ? Math.round(pct(n.mem, n.memTotal) * 100) + ' %' : '–'}`, 'serveur', { accent: '#FF9A5C', ok: pveOn });
  const guests = [[100, 'ha', 'Home Assistant', 'maison', '#5CC8FF'], [110, 'visages', 'Visages', 'visage', '#B9A8FF'], [120, 'tableau', 'Tableau de bord', 'tableau', '#B9A8FF']];
  guests.forEach(([vmid, sid, nom, ic, c], i) => {
    const m = M(vmid), s = S(sid), on = m && m.status === 'running';
    node('g' + vmid, 70 + i * 176, 540, 164, 92, nom, `${ipOf(s) || '–'}`, ic, { accent: c, ok: m ? on : null, tag: `${m ? (m.type === 'lxc' ? 'LXC' : 'VM') : '—'} ${vmid}`, extra: on ? `${Math.round((m.cpu || 0) * 100)} % · ${Gn(m.mem)}/${Go(m.maxmem)}` : (m ? 'arrêtée' : 'à installer') });
  });
  // Appareils (à droite)
  const devs = [['tablette', 'Tablette entrée', 'Fully Kiosk', 'tablette', 'wifi'], ['garage', 'Shelly 1 Gen4', 'Porte du garage', 'garage', 'wifi'], ['appletv', 'Apple TV', 'Salon', 'tv', 'wifi'], ['hue', 'Pont Philips Hue', 'Passerelle Zigbee', 'lien', 'eth']];
  devs.forEach(([sid, nom, sub, ic, link], i) => { const s = S(sid); node(sid, 820, 360 + i * 82, 300, 62, nom, `${ipOf(s) ? ipOf(s) + ' · ' : ''}${sub}`, ic, { ok: s.externe ? null : s.ok, link }); });
  node('lampes', 820, 720, 300, 58, 'Lampes et détecteur Hue', 'Réseau Zigbee du pont', 'lien', { ok: null });
  node('netatmo', 880, 122, 260, 58, 'Netatmo', 'Sonnette · caméra · thermostat', 'monde', { ok: null });
  node('nabu', 180, 122, 240, 58, 'Nabu Casa', 'Accès à distance à HA', 'monde', { ok: null });

  const C = (id, side) => { const b = nodes[id]; return side === 't' ? [b.x + b.w / 2, b.y] : side === 'b' ? [b.x + b.w / 2, b.y + b.h] : side === 'l' ? [b.x, b.y + b.h / 2] : [b.x + b.w, b.y + b.h / 2]; };
  const edges = [];
  const path = (pts, type, label, lx, ly) => edges.push({ d: 'M' + pts.map((p) => p.join(',')).join(' L'), type, label, lx, ly });
  const [ix, iy] = C('inet', 'b'), [bx, by] = C('box', 't'); path([[ix, iy], [bx, by]], 'fibre', 'Fibre', ix + 10, (iy + by) / 2 + 4);
  const [b2x, b2y] = C('box', 'b'), [gx, gy] = C('gw', 't'); path([[b2x, b2y], [gx, gy]], 'eth', 'Ethernet', b2x + 10, (b2y + gy) / 2 + 4);
  // Routeur → Proxmox
  const [gbx, gby] = C('gw', 'b'), [px, py] = C('pve', 't'); path([[gbx, gby], [gbx, 340], [px, 340], [px, py]], 'eth', 'Ethernet', px + 10, 368);
  // Proxmox → machines (pont virtuel)
  const [pbx, pby] = C('pve', 'b');
  guests.forEach(([vmid]) => { const [tx, ty] = C('g' + vmid, 't'); path([[pbx, pby], [pbx, 505], [tx, 505], [tx, ty]], 'virt', '', 0, 0); });
  edges.push({ label: 'vmbr0 · pont virtuel', type: 'virt', lx: pbx + 10, ly: 500, only: true });
  // Routeur → appareils (bus vertical à droite)
  const [grx, gry] = C('gw', 'r');
  devs.forEach(([sid, , , , link]) => { const [lx, ly] = C(sid, 'l'); path([[grx, gry], [770, gry], [770, ly], [lx, ly]], link, '', 0, 0); });
  edges.push({ label: 'Wi-Fi / Ethernet', type: 'wifi', lx: 778, ly: gry - 8, only: true });
  // Hue → lampes (Zigbee)
  const [hbx, hby] = C('hue', 'b'), [lpx, lpy] = C('lampes', 't'); path([[hbx, hby], [lpx, lpy]], 'zigbee', 'Zigbee', hbx + 10, (hby + lpy) / 2 + 4);
  // Cloud : Internet ↔ Netatmo, Internet ↔ Nabu Casa
  const [irx, iry] = C('inet', 'r'), [nlx, nly] = C('netatmo', 'l'); path([[irx, iry], [nlx - 40, iry], [nlx - 40, nly], [nlx, nly]], 'cloud', '', 0, 0);
  const [ilx, ily] = C('inet', 'l'), [nrx, nry] = C('nabu', 'r'); path([[ilx, ily], [nrx + 40, ily], [nrx + 40, nry], [nrx, nry]], 'cloud', '', 0, 0);
  // Netatmo en Wi-Fi sur le réseau local
  const [ntx, nty] = C('netatmo', 'b'); path([[ntx, nty], [ntx, gry - 20], [grx + 20, gry - 20], [grx + 20, gry - 4]], 'wifi', '', 0, 0);

  const ICO = (name, x, y, c) => `<g transform="translate(${x},${y})" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.lien}</g>`;
  let s = `<svg class="arch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schéma d'architecture du réseau de la maison">`;
  // Zones
  s += `<rect x="40" y="208" width="1120" height="636" rx="22" fill="rgba(61,214,140,0.025)" stroke="rgba(61,214,140,0.35)" stroke-dasharray="6 6"/>
    <text x="60" y="232" font-size="12" font-weight="700" fill="#7BE2AE" letter-spacing="1.5">LAN 192.168.86.0/24</text>
    <text x="60" y="250" font-size="11" fill="#7F8592">Pas de VLAN · réseau unique</text>
    <rect x="56" y="372" width="544" height="282" rx="18" fill="rgba(255,154,92,0.03)" stroke="rgba(255,154,92,0.45)"/>
    <text x="72" y="672" font-size="11" fill="#B07A5C" letter-spacing="1.2">HÔTE PHYSIQUE · 1 câble Ethernet</text>
    <rect x="800" y="340" width="340" height="452" rx="18" fill="rgba(127,176,255,0.025)" stroke="rgba(127,176,255,0.35)" stroke-dasharray="4 5"/>
    <text x="816" y="812" font-size="11" fill="#7F96BF" letter-spacing="1.2">OBJETS CONNECTÉS</text>`;
  edges.filter((e) => !e.only).forEach((e) => { const t = L[e.type]; s += `<path d="${e.d}" fill="none" stroke="${t[0]}" stroke-width="2" ${t[1] ? `stroke-dasharray="${t[1]}"` : ''} stroke-linejoin="round" opacity="0.85"/>`; });
  edges.filter((e) => e.label).forEach((e) => { s += `<text x="${e.lx}" y="${e.ly}" font-size="11" fill="${L[e.type][0]}" class="mono">${esc(e.label)}</text>`; });
  out.forEach((b) => {
    const c = b.accent || '#9AA0AC';
    s += `<g><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="12" fill="#14171D" stroke="${c}" stroke-opacity="0.55"/>
      <rect x="${b.x + 10}" y="${b.y + 11}" width="36" height="36" rx="9" fill="${c}" fill-opacity="0.14"/>${ICO(b.ic, b.x + 16, b.y + 17, c)}
      <text x="${b.x + 56}" y="${b.y + 26}" font-size="${b.tag ? 13 : 14}" font-weight="600" fill="#F2F1EE">${esc(b.title)}</text>
      <text x="${b.x + 56}" y="${b.y + 44}" font-size="11" fill="#9A9DA6" class="mono">${esc(b.sub)}</text>`;
    if (b.tag) s += `<text x="${b.x + 10}" y="${b.y + 68}" font-size="10" fill="${c}" class="mono" letter-spacing="1">${esc(b.tag)}</text><text x="${b.x + 10}" y="${b.y + 83}" font-size="11" fill="#C9CBD0" class="mono">${esc(b.extra || '')}</text>`;
    if (b.ok !== undefined) s += `<circle cx="${b.x + b.w - 14}" cy="${b.y + 14}" r="5" fill="${dot(b.ok)}"/>`;
    s += '</g>';
  });
  s += '</svg>';
  $('net').innerHTML = `<div class="arch-wrap">${s}</div>${scanHtml(sv)}`;
  $('legend').innerHTML = Object.values(L).map((t) => `<span><i style="border-color:${t[0]};${t[1] ? 'border-top-style:dashed' : ''}"></i>${t[2]}</span>`).join('');
}
$('gear').addEventListener('click', () => { $('ov').hidden = false; drawNet(); loadReseau(); });
setInterval(() => { if (!$('ov').hidden) loadReseau(); }, 60000);
$('ovx').addEventListener('click', () => { $('ov').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('ov').hidden = true; });

let built = '';
function render(d) {
  lastData = d;
  if (!$('ov').hidden) drawNet();
  $('err').hidden = !d.erreur;
  if (d.erreur) $('err').textContent = 'Le serveur Proxmox ne répond pas (' + d.erreur + '). Les raccourcis restent utilisables.';
  const n = d.noeud;
  if (n) $('sub').textContent = `Proxmox ${n.version ? (n.version.split('/')[1] || '') : ''} · ${(d.machines || []).filter((m) => m.status === 'running').length} machines en marche`;
  const sv = (d.services || []).filter((s) => s.tuile !== false);
  const key = sv.map((s) => s.id).join('|');
  if (key !== built) {
    built = key;
    $('tiles').innerHTML = sv.map((s) => {
      const c = COLORS[s.icone] || COLORS.monde;
      return `<a class="tile" href="${esc(s.url)}" target="_blank" rel="noopener">
        <span class="ico" style="--c:${c[0]};--ic:${c[1]}">${s.logo ? `<img class="logo" alt="" src="${LOGOS}/svg/${esc(s.logo)}.svg" data-png="${LOGOS}/png/${esc(s.logo)}.png" onerror="if(this.dataset.png){this.src=this.dataset.png;this.dataset.png='';}else{this.replaceWith(document.createRange().createContextualFragment(window.svgFor('${esc(s.icone)}')));}">` : svg(s.icone, 28)}</span>
        <span class="name"><b>${esc(s.nom)}</b><code>${esc(s.url.replace(/^https?:\/\//, ''))}</code><small data-sub="${esc(s.id)}"></small></span>
        <span class="state" data-st="${esc(s.id)}"><i></i><span></span></span>
        <div class="metrics" data-mt="${esc(s.id)}"></div>
      </a>`;
    }).join('');
  }
  sv.forEach((s) => {
    const q = (a) => document.querySelector(`[${a}="${CSS.escape(s.id)}"]`);
    const st = q('data-st'), mt = q('data-mt'), sb = q('data-sub');
    if (!st) return;
    st.className = 'state ' + (s.externe ? '' : s.ok === true ? 'ok' : s.ok === false ? 'ko' : '');
    st.lastElementChild.textContent = s.externe ? 'internet' : s.ok === true ? `en ligne · ${s.ms} ms` : s.ok === false ? 'hors ligne' : '…';
    mt.innerHTML = metrics(s, d);
    sb.textContent = subline(s, d);
  });
  $('maj').textContent = new Date().toLocaleTimeString('fr-FR');
}

async function tick() {
  try { const r = await fetch('/api/etat', { cache: 'no-store' }); render(await r.json()); }
  catch (e) { $('err').hidden = false; $('err').textContent = 'Le tableau de bord ne répond plus. Nouvel essai dans 2 secondes.'; }
}
function clock() { $('clock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
clock(); setInterval(clock, 5000);
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
